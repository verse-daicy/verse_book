      <script>
      (function() {
        const RAILWAY_URL = "https://verse-server-production-d132dab9.up.railway.app";
        
        // 核心：只针对特定路径进行修补，绝不乱动其他请求
        function fixUrl(url) {
          if (typeof url !== 'string') return url;
          if (url.includes('railway.app')) return url;

          // 1. 修复 API 请求（解决 books 和 mine 的 404）
          // 前端请求通常是 /books, /mine, /api/xxx，或者以这些开头的相对路径
          if (url === '/books' || url.startsWith('/books?') || 
              url === '/mine' || url.startsWith('/mine?') ||
              url.startsWith('/api/')) {
            console.log("🚀 修复API请求:", url, "->", RAILWAY_URL + (url.startsWith('/api/') ? url : '/api' + url));
            return RAILWAY_URL + (url.startsWith('/api/') ? url : '/api' + url);
          }

          // 2. 修复静态资源请求（解决图片 404）
          // 如果请求了 /reading-fireplace.png 等，说明它在找根目录，我们强行给它加上 /verse_book/
          if (url.startsWith('/') && !url.startsWith('/verse_book/') && !url.startsWith('/api/')) {
            console.log("🖼️ 修复静态资源:", url, "-> /verse_book" + url);
            return "/verse_book" + url;
          }
          
          return url;
        }

        // 劫持 fetch
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          if (typeof input === 'string') {
            input = fixUrl(input);
          } else if (input instanceof Request) {
            const newUrl = fixUrl(input.url);
            if (newUrl !== input.url) input = new Request(newUrl, input);
          }
          return originalFetch(input, init);
        };

        // 劫持 XMLHttpRequest (防 axios)
        const originalXHR = window.XMLHttpRequest;
        window.XMLHttpRequest = function() {
          const xhr = new originalXHR();
          const originalOpen = xhr.open;
          xhr.open = function(method, url, ...args) {
            return originalOpen.call(this, method, fixUrl(url), ...args);
          };
          return xhr;
        };
      })();
    </script>

        <!-- 🚀 终极救命补丁：强行关遮罩 + 强行修正图片路径 -->
    <script>
      (function() {
        // 1. 强行关掉那个“装点书屋”的遮罩
        // 不管 Vue 报什么错，1.5秒后我们直接把这个遮罩从页面上拔掉！
        setTimeout(function() {
          const mask = document.getElementById('custom-loading-mask');
          if (mask) {
            console.log("强制移除加载遮罩");
            mask.style.display = 'none';
            mask.remove(); // 直接删掉它
          }
        }, 1500);

        // 2. 强行修正图片路径
        // 监听所有图片的加载失败事件
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG') {
            let img = e.target;
            // 如果这张图还没尝试过修复，并且不是 base64 数据
            if (!img.dataset.triedFix && img.src.indexOf('data:image') === -1) {
              img.dataset.triedFix = 'true';
              let filename = img.src.split('/').pop();
              
              // 方案 A：如果在 GitHub 仓库根目录
              let newSrc1 = `https://verse-daicy.github.io/verse_book/${filename}`;
              
              console.log("尝试修复图片:", img.src, "->", newSrc1);
              img.src = newSrc1; 
              
              // 如果改了还是错，触发第二次修复，尝试去 assets 或 covers 找
              img.addEventListener('error', function() {
                if (img.dataset.triedFix2) return;
                img.dataset.triedFix2 = 'true';
                let newSrc2 = `https://verse-daicy.github.io/verse_book/assets/${filename}`;
                let newSrc3 = `https://verse-daicy.github.io/verse_book/covers/${filename}`;
                console.log("尝试去子目录找:", newSrc2);
                img.src = newSrc2;
                
                img.addEventListener('error', function() {
                   img.src = newSrc3;
                }, {once: true});
              }, {once: true});
            }
          }
        }, true); // true 表示捕获阶段拦截
      })();

      // ========================================================
      // 🌟 终极防线：数据绝对保护 + 正常换色渲染
      // ========================================================
      (function() {
        const originalSetItem = Storage.prototype.setItem;
        const originalGetItem = Storage.prototype.getItem;
        
        Storage.prototype.setItem = function(key, value) {
          if (key === 'verse_settings' || key === 'sylvia_settings') {
            try {
              let newSettings = JSON.parse(value);
              let oldStr = originalGetItem.call(this, key);
              
              if (oldStr && !window.__IS_RESETTING) {
                let oldSettings = JSON.parse(oldStr);
                if (!newSettings.homeTheme && oldSettings.homeTheme) newSettings.homeTheme = oldSettings.homeTheme;
                if (!newSettings.roomTheme && oldSettings.roomTheme) newSettings.roomTheme = oldSettings.roomTheme;
                
                if (newSettings.homeTheme !== newSettings.roomTheme) {
                  let target = newSettings.homeTheme || newSettings.roomTheme;
                  newSettings.homeTheme = target;
                  newSettings.roomTheme = target;
                }
              }
              value = JSON.stringify(newSettings);
            } catch (e) {}
          }
          originalSetItem.call(this, key, value);
        };

        document.addEventListener('click', function(e) {
          if (e.target.closest('.decor-btn.reset')) {
            window.__IS_RESETTING = true;
            setTimeout(() => {
              try {
                let s = originalGetItem.call(localStorage, 'verse_settings') || originalGetItem.call(localStorage, 'sylvia_settings');
                if (s) {
                  let settings = JSON.parse(s);
                  settings.homeTheme = "";
                  settings.roomTheme = "";
                  originalSetItem.call(localStorage, 'verse_settings', JSON.stringify(settings));
                  originalSetItem.call(localStorage, 'sylvia_settings', JSON.stringify(settings));
                }
              } catch (err) {}
            }, 50);
          }
        });
      })();
     
    </script>
