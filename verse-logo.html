<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center; /* 绝对居中 */
      align-items: flex-start;
      padding-top: 25px; /* 距离顶部的距离 */
      background: transparent; /* 完全透明，不遮挡你的网页 */
      pointer-events: none; /* 鼠标穿透，你照常点底下的东西 */
    }
    .logo-text {
      font-size: 36px; 
      font-weight: 900; 
      letter-spacing: 5px; 
      font-family: "Songti SC", "Noto Serif SC", serif;
      background: linear-gradient(135deg, #ff6b9d 0%, #9d4edd 100%);
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(157, 78, 221, 0.4)); 
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="logo-text">Verse</div>
</body>
</html>
